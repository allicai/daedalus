[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daedalus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "datasets>=2.0",
    "huggingface-hub>=0.20",
    "requests>=2.28",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]
prescient = [
    "nnsight>=0.3",
    "torch>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.scripts]
daedalus = "daedalus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daedalus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
